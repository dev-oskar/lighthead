<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tolerance break: start</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <span class="lh-overline">Tolerance break</span>
      <h1 class="lh-title">Take a break</h1>
    </header>
    <p style="margin: 0; font-size: 17px; line-height: 26px; color: var(--ink)">Pick a length. You can end it early at any time, and you can still log sessions while it runs.</p>
    <x-import component-from-global-scope="LightHead.OptionGrid" label="Length" columns="{{three}}" default-value="21" options="{{lengths}}"></x-import>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: var(--ink-muted)">
      <x-import component-from-global-scope="LightHead.Icon" name="calendar" size="{{sixteen}}"></x-import>
      <span>Starts today · ends <span class="lh-data" style="font-size: 14px; color: var(--ink)">Wed, 11 Nov</span></span>
    </div>
    <x-import component-from-global-scope="LightHead.Button" variant="primary" size="lg" block="{{yes}}">Start a break</x-import>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="lh-overline" style="margin: 0">Past breaks</h2>
      <div style="display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line)"><span>June 2026</span><span class="lh-data">21 days</span></div>
      <div style="display: flex; justify-content: space-between; gap: 8px; padding: 8px 0"><span>March 2026</span><span class="lh-data">9 of 14 days</span></div>
    </section>
  </main>
  <x-import component-from-global-scope="LightHead.TabBar" default-value="break"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
three: 3, sixteen: 16, yes: true,
lengths: [
{ value: '2', label: '2 days' },
{ value: '7', label: '7 days' },
{ value: '14', label: '14 days' },
{ value: '21', label: '21 days' },
{ value: '28', label: '28 days' }
]
};
}
}
</script>
</body>
</html>
