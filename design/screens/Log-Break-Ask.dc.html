<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log session during a break</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; margin-left: -12px">
      <x-import component-from-global-scope="LightHead.Button" variant="quiet" icon="close" aria-label="Close"></x-import>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-top: 48px">
      <div style="width: 72px; height: 72px; border-radius: 22px 4px 22px 4px; background: var(--tide-soft); color: var(--tide); display: flex; align-items: center; justify-content: center">
        <x-import component-from-global-scope="LightHead.Icon" name="break" size="{{n36}}"></x-import>
      </div>
      <span class="lh-overline">Tolerance break</span>
      <h1 class="lh-title">You are on day 9 of 21</h1>
      <p style="margin: 0; font-size: 17px; line-height: 26px; color: var(--ink-muted)">You can end the break now, or log this session and keep the break running.</p>
    </div>
  </main>
  <div style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <x-import component-from-global-scope="LightHead.Button" variant="primary" size="lg" block="{{yes}}">Log and keep the break</x-import>
    <x-import component-from-global-scope="LightHead.Button" variant="secondary" size="lg" block="{{yes}}">End break and log</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
yes: true, n36: 36
};
}
}
</script>
</body>
</html>
