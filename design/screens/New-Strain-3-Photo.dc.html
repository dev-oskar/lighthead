<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New strain: photo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <x-import component-from-global-scope="LightHead.StepHeader" step="{{three}}" total="{{three}}" title="Add a photo?" subtitle="Optional. It helps you spot the strain in lists." close-label="Back"></x-import>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 0 8px">
      <x-import component-from-global-scope="LightHead.StrainAvatar" name="Durban Poison" type="sativa" size="{{n160}}" editable="{{yes}}"></x-import>
      <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); text-align: center">Tap to take a photo or choose one</p>
    </div>
    <x-import component-from-global-scope="LightHead.Notice" tone="private" icon="lock" title="Stays on this device">Location and camera details are removed before it is saved.</x-import>
  </main>
  <div style="padding: 0 16px">
    <x-import component-from-global-scope="LightHead.ActionBar" primary="Save strain" secondary="{{yes}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
three: 3, n160: 160, yes: true
};
}
}
</script>
</body>
</html>
