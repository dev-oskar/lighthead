<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <span class="lh-overline">Wednesday, 21 October</span>
      <h1 class="lh-title">Today</h1>
    </header>
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <x-import component-from-global-scope="LightHead.StatTile" label="This week" value="1.35" unit="g" trend="{{weekTrend}}" note="9 sessions"></x-import>
      <x-import component-from-global-scope="LightHead.StatTile" label="Last session" value="2" unit="h" tone="tide" note="ago, at 21:40"></x-import>
    </section>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="lh-overline" style="margin: 0">Today</h2>
      <x-import component-from-global-scope="LightHead.SessionCard" time="21:40" ago="Today" strain="Northern Lights" type="indica" method="Vape" amount="0.15 g" setting="At home" effects="{{effectsA}}" photo="{{nlPhoto}}" note="Lower temperature felt smoother." rating="{{four}}"></x-import>
      <h2 class="lh-overline" style="margin: 12px 0 0">Yesterday</h2>
      <x-import component-from-global-scope="LightHead.SessionCard" time="19:10" ago="Tue" strain="Durban Poison" type="sativa" method="Joint" amount="0.3 g" setting="Garden"></x-import>
    </section>
  </main>
  <div style="position: absolute; right: 16px; bottom: 92px">
    <x-import component-from-global-scope="LightHead.Button" variant="primary" size="lg" class-name="lh-btn-fab" icon="plus">Log session</x-import>
  </div>
  <x-import component-from-global-scope="LightHead.TabBar" default-value="today"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
function examplePhoto() {
/* Sample stand-in for a user's own strain photo: a painted texture, not a real strain. */
try {
var c = document.createElement('canvas'); c.width = c.height = 224; var g = c.getContext('2d');
var bg = g.createRadialGradient(90, 80, 10, 112, 112, 160); bg.addColorStop(0, '#9dbf8a'); bg.addColorStop(0.55, '#4f7a45'); bg.addColorStop(1, '#22361f');
g.fillStyle = bg; g.fillRect(0, 0, 224, 224);
var s = 7; function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
for (var i = 0; i < 260; i++) { g.fillStyle = 'rgba(' + (220 + r() * 35 | 0) + ',' + (200 + r() * 40 | 0) + ',150,' + (r() * 0.35) + ')'; g.beginPath(); g.arc(r() * 224, r() * 224, r() * 3 + 0.5, 0, 7); g.fill(); }
return c.toDataURL('image/jpeg', 0.85);
} catch (e) { return undefined; }
}
class Component extends DCLogic {
renderVals() {
if (this._photo === undefined) this._photo = examplePhoto() || null;
return {
theme: this.props.dark ? 'dark' : 'light',
nlPhoto: this._photo || undefined,
weekTrend: [0.3, 0.2, 0.25, 0, 0.15, 0.3, 0.15],
effectsA: ['Calm', 'Sleepy'],
four: 4
};
}
}
</script>
</body>
</html>
