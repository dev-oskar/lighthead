<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log session: how you feel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <x-import component-from-global-scope="LightHead.StepHeader" step="{{three}}" total="{{three}}" title="How do you feel?" subtitle="Optional. You can add this later." close-label="Back"></x-import>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="lh-overline" style="margin: 0">Effects</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <x-import component-from-global-scope="LightHead.Chip" default-selected="{{yes}}">Calm</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Happy</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Creative</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Focused</x-import>
        <x-import component-from-global-scope="LightHead.Chip" default-selected="{{yes}}">Sleepy</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Hungry</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Dry mouth</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Anxious</x-import>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="lh-overline" style="margin: 0">Rating</h2>
      <x-import component-from-global-scope="LightHead.Rating" size="{{thirtySix}}" label="Rating"></x-import>
    </section>
    <x-import component-from-global-scope="LightHead.TextField" label="Note" multiline="{{yes}}" rows="{{three}}" placeholder="Anything worth remembering?"></x-import>
  </main>
  <div style="padding: 0 16px">
    <x-import component-from-global-scope="LightHead.ActionBar" primary="Save session" secondary="{{yes}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
three: 3, thirtySix: 36, yes: true
};
}
}
</script>
</body>
</html>
