<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strains, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px; overflow: hidden">
  <nav aria-label="Main" style="width: 248px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 28px 16px; background: var(--surface-raised); border-right: 1px solid var(--line)">
    <span class="lh-title" style="padding: 0 12px 20px">LightHead</span>
    <x-import component-from-global-scope="LightHead.Button" variant="primary" size="lg" icon="plus" class-name="lh-btn-fab" block="{{yes}}">Log session</x-import>
    <div style="height: 16px"></div>
    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border-radius: 9999px; color: var(--ink-muted); font-size: 16px; font-weight: 600; text-decoration: none">
      <x-import component-from-global-scope="LightHead.Icon" name="home" size="{{n24}}"></x-import>Today</a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border-radius: 9999px; color: var(--ink-muted); font-size: 16px; font-weight: 600; text-decoration: none">
      <x-import component-from-global-scope="LightHead.Icon" name="session" size="{{n24}}"></x-import>Journal</a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border-radius: 9999px; background: var(--moss-soft); color: var(--moss); font-size: 16px; font-weight: 600; text-decoration: none">
      <x-import component-from-global-scope="LightHead.Icon" name="leaf" size="{{n24}}"></x-import>Strains</a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border-radius: 9999px; color: var(--ink-muted); font-size: 16px; font-weight: 600; text-decoration: none">
      <x-import component-from-global-scope="LightHead.Icon" name="stats" size="{{n24}}"></x-import>Stats</a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border-radius: 9999px; color: var(--ink-muted); font-size: 16px; font-weight: 600; text-decoration: none">
      <x-import component-from-global-scope="LightHead.Icon" name="break" size="{{n24}}"></x-import>Break</a>
    <div style="flex: 1"></div>
    <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border-radius: 9999px; color: var(--ink-muted); font-size: 16px; font-weight: 600; text-decoration: none">
      <x-import component-from-global-scope="LightHead.Icon" name="lock" size="{{n24}}"></x-import>Settings</a>
  </nav>
  <main style="flex: 1; min-width: 0; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span class="lh-overline">4 strains · 3 in stash</span>
        <h1 class="lh-title">Strains</h1>
      </div>
      <x-import component-from-global-scope="LightHead.Button" variant="secondary" icon="plus">Add strain</x-import>
    </header>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <x-import component-from-global-scope="LightHead.Chip" default-selected="{{yes}}">All</x-import>
      <x-import component-from-global-scope="LightHead.Chip">Indica</x-import>
      <x-import component-from-global-scope="LightHead.Chip">Sativa</x-import>
      <x-import component-from-global-scope="LightHead.Chip">Hybrid</x-import>
      <x-import component-from-global-scope="LightHead.Chip">CBD</x-import>
    </div>
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start">
      <x-import component-from-global-scope="LightHead.StrainCard" name="Northern Lights" type="indica" breeder="Sensi Seeds" thc="{{n18}}" cbd="{{n02}}" sessions="{{n14}}" in-stash="3.2 g" terpenes="{{terpA}}" rating="{{n4}}"></x-import>
      <x-import component-from-global-scope="LightHead.StrainCard" name="Durban Poison" type="sativa" breeder="Dutch Passion" thc="{{n21}}" cbd="{{n04}}" sessions="{{n6}}" in-stash="1.1 g" terpenes="{{terpB}}" rating="{{n3}}"></x-import>
      <x-import component-from-global-scope="LightHead.StrainCard" name="Blue Dream" type="hybrid" breeder="Humboldt Seeds" thc="{{n19}}" cbd="{{n01}}" sessions="{{n2}}" in-stash="0.8 g" terpenes="{{terpD}}"></x-import>
      <x-import component-from-global-scope="LightHead.StrainCard" name="ACDC" type="cbd" thc="{{n1}}" cbd="{{n16}}" sessions="{{n3}}" in-stash="0 g" terpenes="{{terpC}}"></x-import>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
yes: true, n24: 24,
n18: 18, n02: 0.2, n14: 14, n4: 4, n21: 21, n04: 0.4, n6: 6, n3: 3, n1: 1, n16: 16, n19: 19, n01: 0.1, n2: 2,
terpA: ['Myrcene', 'Caryophyllene'],
terpB: ['Terpinolene', 'Pinene'],
terpC: ['Myrcene', 'Pinene'],
terpD: ['Myrcene', 'Pinene', 'Caryophyllene']
};
}
}
</script>
</body>
</html>
