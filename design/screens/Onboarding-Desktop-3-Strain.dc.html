<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First strain, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px; overflow: hidden">
  <aside style="width: 480px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 48px; background: var(--surface-raised); border-right: 1px solid var(--line)">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="width: 96px; height: 96px; border-radius: 28px 6px 28px 6px; background: var(--moss-soft); color: var(--moss); display: flex; align-items: center; justify-content: center">
        <x-import component-from-global-scope="LightHead.Icon" name="leaf" size="{{n48}}"></x-import>
      </div>
      <h1 class="lh-display" style="margin: 8px 0 0">LightHead</h1>
      <p style="margin: 0; font-size: 19px; line-height: 28px; max-width: 340px">A quiet journal for your sessions, strains and breaks.</p>
    </div>
    <x-import component-from-global-scope="LightHead.Notice" tone="private" icon="lock" title="Stored on this device only">No account, no tracking. Nothing you log is sent anywhere.</x-import>
  </aside>
  <main style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 48px">
    <div style="width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 28px">
      <x-import component-from-global-scope="LightHead.StepHeader" step="{{three}}" total="{{three}}" title="What do you have at home?" subtitle="Add a strain once with its THC and CBD. Logging then takes three taps." close-label="Back"></x-import>
      <div style="display: flex; align-items: center; gap: 12px; padding: 20px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 22px 4px 22px 4px">
        <x-import component-from-global-scope="LightHead.StrainAvatar" name="Your strain" type="hybrid" size="lg"></x-import>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span class="lh-heading">Name, type and label</span>
          <span class="lh-meta">THC and CBD from the package. A photo is optional.</span>
        </div>
      </div>
      <p class="lh-meta" style="margin: 0">You can also do this later from Strains.</p>
      <x-import component-from-global-scope="LightHead.ActionBar" primary="Add a strain" secondary="Later"></x-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
one: 1, two: 2, three: 3, n16: 16, n48: 48, yes: true,
langs: [
{ value: 'en', label: 'English' },
{ value: 'de', label: 'Deutsch' },
{ value: 'pl', label: 'Polski' }
]
};
}
}
</script>
</body>
</html>
