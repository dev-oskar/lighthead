<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session saved</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 160px 24px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
    <div style="width: 72px; height: 72px; border-radius: 22px 4px 22px 4px; background: var(--tide-soft); color: var(--tide); display: flex; align-items: center; justify-content: center">
      <x-import component-from-global-scope="LightHead.Icon" name="check" size="{{thirtySix}}"></x-import>
    </div>
    <h1 class="lh-title" style="margin-top: 8px">Session saved</h1>
    <p class="lh-data" style="margin: 0; color: var(--ink)">21:40 · Northern Lights · 0.15 g</p>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted)">≈ 27 mg THC · Calm, Sleepy</p>
    <div style="margin-top: 16px">
      <x-import component-from-global-scope="LightHead.Button" variant="quiet">Edit session</x-import>
    </div>
  </main>
  <div style="padding: 0 16px">
    <x-import component-from-global-scope="LightHead.ActionBar" primary="Done"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
thirtySix: 36
};
}
}
</script>
</body>
</html>
