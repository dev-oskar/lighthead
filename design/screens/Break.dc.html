<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tolerance break</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <span class="lh-overline">Tolerance break</span>
      <h1 class="lh-title">Day 9 of 21</h1>
    </header>
    <x-import component-from-global-scope="LightHead.BreakProgress" day="{{n9}}" total="{{n21}}" since="Started Tue, 13 Oct · ends Mon, 2 Nov"></x-import>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 class="lh-overline" style="margin: 0">Notes on this break</h2>
        <x-import component-from-global-scope="LightHead.Button" variant="quiet" icon="plus">Add a note</x-import>
      </div>
      <article class="lh-card" style="display: flex; flex-direction: column; gap: 4px">
        <span class="lh-data" style="font-size: 14px; color: var(--ink-muted)">Day 7 · Mon</span>
        <p class="lh-note">Sleeping better than the first nights.</p>
      </article>
      <article class="lh-card" style="display: flex; flex-direction: column; gap: 4px">
        <span class="lh-data" style="font-size: 14px; color: var(--ink-muted)">Day 3 · Thu</span>
        <p class="lh-note">Evenings feel long. A walk helped.</p>
      </article>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="lh-overline" style="margin: 0">Past breaks</h2>
      <div style="display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line)"><span>June 2026</span><span class="lh-data">21 days</span></div>
      <div style="display: flex; justify-content: space-between; gap: 8px; padding: 8px 0"><span>March 2026</span><span class="lh-data">14 days</span></div>
    </section>
  </main>
  <x-import component-from-global-scope="LightHead.TabBar" default-value="break"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
n9: 9, n21: 21
};
}
}
</script>
</body>
</html>
