<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span class="lh-overline">47 sessions</span>
        <h1 class="lh-title">Journal</h1>
      </div>
      <x-import component-from-global-scope="LightHead.Button" variant="secondary" icon="plus">Log session</x-import>
    </header>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="lh-overline" style="margin: 0">Today</h2>
      <x-import component-from-global-scope="LightHead.SessionCard" time="21:40" ago="Today" strain="Northern Lights" type="indica" method="Vape" amount="0.15 g" setting="At home" effects="{{effA}}" rating="{{n4}}"></x-import>
      <h2 class="lh-overline" style="margin: 12px 0 0">Tuesday, 20 October</h2>
      <x-import component-from-global-scope="LightHead.SessionCard" time="19:10" ago="Tue" strain="Durban Poison" type="sativa" method="Joint" amount="0.3 g" setting="Outside"></x-import>
      <x-import component-from-global-scope="LightHead.SessionCard" time="13:05" ago="Tue" strain="ACDC" type="cbd" method="Edible" amount="5 mg" effects="{{effB}}"></x-import>
      <h2 class="lh-overline" style="margin: 12px 0 0">Sunday, 18 October</h2>
      <x-import component-from-global-scope="LightHead.SessionCard" time="22:05" ago="Sun" strain="Northern Lights" type="indica" method="Vape" amount="0.2 g" setting="At home" effects="{{effC}}"></x-import>
    </section>
  </main>
  <x-import component-from-global-scope="LightHead.TabBar" default-value="log"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
n4: 4,
effA: ['Calm', 'Sleepy'],
effB: ['Calm'],
effC: ['Calm']
};
}
}
</script>
</body>
</html>
