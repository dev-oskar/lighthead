<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 24px">
    <x-import component-from-global-scope="LightHead.StepHeader" step="{{one}}" total="{{three}}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 32px">
      <div style="width: 72px; height: 72px; border-radius: 22px 4px 22px 4px; background: var(--moss-soft); color: var(--moss); display: flex; align-items: center; justify-content: center">
        <x-import component-from-global-scope="LightHead.Icon" name="leaf" size="{{n36}}"></x-import>
      </div>
      <h1 class="lh-display">LightHead</h1>
      <p style="margin: 0; font-size: 17px; line-height: 26px">A quiet journal for your sessions, strains and breaks.</p>
    </div>
    <x-import component-from-global-scope="LightHead.Notice" tone="private" icon="lock" title="Stored on this device only">No account, no tracking. Nothing you log is sent anywhere.</x-import>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="lh-overline" style="margin: 0">Language</h2>
      <x-import component-from-global-scope="LightHead.SegmentedControl" label="Language" default-value="en" options="{{langs}}"></x-import>
    </section>
  </main>
  <div style="padding: 0 16px">
    <x-import component-from-global-scope="LightHead.ActionBar"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
one: 1, three: 3, n36: 36,
langs: [
{ value: 'en', label: 'English' },
{ value: 'de', label: 'Deutsch' },
{ value: 'pl', label: 'Polski' }
]
};
}
}
</script>
</body>
</html>
