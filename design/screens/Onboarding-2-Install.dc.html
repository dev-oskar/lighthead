<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keep it on your home screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <x-import component-from-global-scope="LightHead.StepHeader" step="{{two}}" total="{{three}}" title="Keep it on your home screen" subtitle="Your journal lives in this browser. On the home screen it opens like an app and the browser keeps your data." close-label="Back"></x-import>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
      <li class="lh-card" style="display: flex; align-items: center; gap: 12px">
        <span class="lh-data" style="width: 32px; height: 32px; flex: none; border-radius: 9999px; background: var(--surface-sunk); display: flex; align-items: center; justify-content: center">1</span>
        <span>Tap <strong>Share</strong> in Safari's toolbar</span>
      </li>
      <li class="lh-card" style="display: flex; align-items: center; gap: 12px">
        <span class="lh-data" style="width: 32px; height: 32px; flex: none; border-radius: 9999px; background: var(--surface-sunk); display: flex; align-items: center; justify-content: center">2</span>
        <span>Choose <strong>Add to Home Screen</strong></span>
      </li>
      <li class="lh-card" style="display: flex; align-items: center; gap: 12px">
        <span class="lh-data" style="width: 32px; height: 32px; flex: none; border-radius: 9999px; background: var(--surface-sunk); display: flex; align-items: center; justify-content: center">3</span>
        <span>Open LightHead from the new icon</span>
      </li>
    </ol>
    <p class="lh-meta" style="display: flex; align-items: center; gap: 8px">
      <x-import component-from-global-scope="LightHead.Icon" name="check" size="{{sixteen}}"></x-import>
      Works without internet once it is installed.
    </p>
  </main>
  <div style="padding: 0 16px">
    <x-import component-from-global-scope="LightHead.ActionBar" secondary="{{yes}}"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
two: 2, three: 3, sixteen: 16, yes: true
};
}
}
</script>
</body>
</html>
