<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New strain: THC and CBD</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lighthead/components/bundle.css">
<script src="ds/lighthead/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--moss)}a:hover{color:var(--moss-strong)}
</style>
</helmet>
<div class="lh-screen" data-theme="{{theme}}">
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <x-import component-from-global-scope="LightHead.StepHeader" step="{{two}}" total="{{three}}" title="What does the label say?" subtitle="You enter this once. Sessions use it to work out THC." close-label="Back"></x-import>
    <x-import component-from-global-scope="LightHead.NumberField" label="THC" unit="%" step="{{half}}" decimals="{{one}}" min="{{zero}}" max="{{hundred}}" default-value="{{thc}}"></x-import>
    <x-import component-from-global-scope="LightHead.NumberField" label="CBD" unit="%" step="{{half}}" decimals="{{one}}" min="{{zero}}" max="{{hundred}}" default-value="{{cbd}}"></x-import>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 class="lh-overline" style="margin: 0">Terpenes (optional)</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <x-import component-from-global-scope="LightHead.Chip">Myrcene</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Limonene</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Caryophyllene</x-import>
        <x-import component-from-global-scope="LightHead.Chip" default-selected="{{yes}}">Terpinolene</x-import>
        <x-import component-from-global-scope="LightHead.Chip" default-selected="{{yes}}">Pinene</x-import>
        <x-import component-from-global-scope="LightHead.Chip">Linalool</x-import>
      </div>
    </section>
  </main>
  <div style="padding: 0 16px">
    <x-import component-from-global-scope="LightHead.ActionBar"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : 'light',
zero: 0, one: 1, two: 2, three: 3, hundred: 100, half: 0.5,
thc: 21, cbd: 0.4, yes: true
};
}
}
</script>
</body>
</html>
