# Headers are in static/_headers (shared with Cloudflare, see wrangler.jsonc).
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# SPA: every route is served by the app shell; the service worker takes over after the first visit.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
